<!doctype html>
<html>
  <head>
    <title>Google Map</title>
  </head>
  <body>
    <h1>My City - Varanasi</h1>

    <!-- loading="lazy" loads the map only when it is needed or close to the visible area. -->
    <iframe
      src="https://www.google.com/maps?q=Varanasi&output=embed"
      title="Google Map of Varanasi"
      width="600"
      height="450"
      loading="lazy"
    >
    </iframe>
  </body>
</html>
