<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #888; }
        .error { color: red; font-size: 13px; }
        button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Login Form</h2>
    <form id="loginForm" novalidate>
        <label for="loginUsername">Username</label>
        <input id="loginUsername" type="text">
        <div id="loginUsernameError" class="error"></div>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password">
        <div id="loginPasswordError" class="error"></div>

        <button type="submit">Login</button>
        <p id="loginResult" aria-live="polite"></p>
    </form>
    <script src="Q7_Login_Form_Validation.js"></script>
</body>
</html>
