<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; }
        .error { color: red; font-size: 13px; }
        button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
        #bookingResult { white-space: pre-line; }
    </style>
</head>
<body>
    <h2>Movie Ticket Booking</h2>
    <form id="ticketForm" novalidate>
        <label for="bookingName">Name</label>
        <input id="bookingName" type="text">
        <div id="bookingNameError" class="error"></div>

        <label for="bookingEmail">Email</label>
        <input id="bookingEmail" type="text">
        <div id="bookingEmailError" class="error"></div>

        <label for="bookingSeats">Seats (1 to 10)</label>
        <input id="bookingSeats" type="number" min="1" max="10">
        <div id="bookingSeatsError" class="error"></div>

        <button type="submit">Book Tickets</button>
        <p id="bookingResult" aria-live="polite"></p>
    </form>
    <script src="Q5_Movie_Ticket_Booking.js"></script>
</body>
</html>
