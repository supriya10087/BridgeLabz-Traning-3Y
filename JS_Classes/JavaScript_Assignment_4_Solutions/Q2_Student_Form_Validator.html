<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #888; border-radius: 4px; }
        .error { color: red; font-size: 13px; }
        button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Student Registration</h2>
    <form id="studentForm" novalidate>
        <label for="studentName">Name</label>
        <input id="studentName" type="text">
        <div id="studentNameError" class="error"></div>

        <label for="studentEmail">Email</label>
        <input id="studentEmail" type="text">
        <div id="studentEmailError" class="error"></div>

        <label for="studentPhone">Phone (10 digits)</label>
        <input id="studentPhone" type="text" inputmode="numeric">
        <div id="studentPhoneError" class="error"></div>

        <label for="studentPassword">Password</label>
        <input id="studentPassword" type="password">
        <div id="studentPasswordError" class="error"></div>

        <button type="submit">Register</button>
        <p id="formResult" aria-live="polite"></p>
    </form>
    <script src="Q2_Student_Form_Validator.js"></script>
</body>
</html>
