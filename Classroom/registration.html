<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form<</title>
  </head>
  <body>
    <form>
      <table border="5">
        <h1 align="center"><b>Student Registration Form</b></h1>
        <table border="1">
          <h1 align="center">Registration Form</h1>
          <tr>
            <td>
              Full Name
              <input
                id="name"
                type="text"
                placeholder="Enter your name"
                name="name"
                required
              />
            </td>
            <br />
            <td>
              Email
              <input id="email" type="email" placeholder="Enter your email" />
              <br />
            </td>
            <br />
            <td>Phone Number <input id="phone" type="tel" /></td>
            <br />
            <td>Date of Birth <input type="date" name="date" /></td>
            <br />
            <td>Gender</td>
            <br />
            <td>Skills</td>
            <br />
            <td>Course</td>
            <br />
            <td>Address</td>
            <br />
            <td>Update resume</td>
            <br />
          </tr>
        </table>
      </table>
    </form>
  </body>
</html>
