<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <main class="page">
        <h1>Styled Button Collection</h1>

        <div class="buttons">
            <button class="btn primary">Primary</button>
            <button class="btn secondary">Secondary</button>
            <button class="btn outline">Outline</button>
            <button class="btn disabled" disabled>Disabled</button>
        </div>

        <label>
            Test focus:
            <input type="text" placeholder="Click here">
        </label>
    </main>
</body>
</html>
