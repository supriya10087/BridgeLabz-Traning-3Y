<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>
    <header class="header">
        <h1>StudySpace</h1>
        <p>Simple learning dashboard</p>
    </header>

    <main class="main">
        <section class="main-card">
            <img src="https://picsum.photos/seed/study/180/120" alt="Study workspace">

            <div class="content">
                <h2>Join Our Study Session</h2>
                <p>Fill in the form below to reserve your place.</p>

                <form>
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Enter your name">

                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Enter your email">

                    <div class="actions">
                        <button class="submit" type="submit">Join Session</button>
                        <button class="cancel" type="reset">Clear</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 StudySpace | Learn. Practice. Grow.</p>
    </footer>
</body>
</html>
