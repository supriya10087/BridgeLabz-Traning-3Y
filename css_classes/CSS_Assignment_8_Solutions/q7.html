<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface Components</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>
    <main class="card">
        <h1>Find a Course</h1>

        <div class="form-area">
            <input class="search" type="search" placeholder="Search courses..." aria-label="Search courses">

            <button class="search-btn">Search</button>

            <select aria-label="Choose category">
                <option>All Categories</option>
                <option>Web Development</option>
                <option>Data Science</option>
                <option>Design</option>
            </select>
        </div>

        <div class="info">
            <h2>Learn Something New</h2>
            <p>Choose a category and search for a course that matches your interest.</p>
        </div>
    </main>
</body>
</html>
