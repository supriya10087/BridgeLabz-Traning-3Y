<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <main class="gallery-page">
        <h1>Image Showcase</h1>
        <p>Six responsive images with hover overlays.</p>

        <section class="gallery">
            <figure class="card">
                <img src="https://picsum.photos/seed/mountain/600/400" alt="Mountain landscape">
                <figcaption>Mountain</figcaption>
            </figure>
            <figure class="card">
                <img src="https://picsum.photos/seed/forest/600/400" alt="Forest landscape">
                <figcaption>Forest</figcaption>
            </figure>
            <figure class="card">
                <img src="https://picsum.photos/seed/ocean/600/400" alt="Ocean view">
                <figcaption>Ocean</figcaption>
            </figure>
            <figure class="card">
                <img src="https://picsum.photos/seed/city/600/400" alt="City view">
                <figcaption>City</figcaption>
            </figure>
            <figure class="card">
                <img src="https://picsum.photos/seed/desert/600/400" alt="Desert landscape">
                <figcaption>Desert</figcaption>
            </figure>
            <figure class="card">
                <img src="https://picsum.photos/seed/lake/600/400" alt="Lake landscape">
                <figcaption>Lake</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
