<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demo</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <main class="page">
        <h1>Tooltip Demonstration</h1>
        <p>Hover over each item to see its tooltip.</p>

        <div class="tooltip-row">
            <div class="tooltip-box">
                <span class="icon">★</span>
                <span class="tooltip-text">This is a star icon</span>
            </div>

            <div class="tooltip-box">
                <span class="icon">?</span>
                <span class="tooltip-text">Help and information</span>
            </div>

            <div class="tooltip-box">
                <span class="icon">✓</span>
                <span class="tooltip-text">Task completed successfully</span>
            </div>

            <div class="tooltip-box">
                <span class="word">CSS</span>
                <span class="tooltip-text">Cascading Style Sheets</span>
            </div>
        </div>
    </main>
</body>
</html>
