<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="q4.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- Header -->
      <header>
        <h1>Dashboard</h1>
      </header>

      <!-- Sidebar -->
      <aside>
        <h2>Menu</h2>

        <nav>
          <a href="#">Home</a>
          <a href="#">Profile</a>
          <a href="#">Analytics</a>
          <a href="#">Settings</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main>
        <div class="box">
          <h2>Total Users</h2>
          <p>1,250</p>
        </div>

        <div class="box">
          <h2>Revenue</h2>
          <p>₹75,000</p>
        </div>

        <div class="box">
          <h2>Orders</h2>
          <p>540</p>
        </div>

        <div class="box">
          <h2>Visitors</h2>
          <p>8,500</p>
        </div>

        <!-- Box spanning two columns -->
        <div class="box wide-box">
          <h2>Monthly Performance</h2>
          <p>Performance overview for this month.</p>
        </div>
      </main>
    </div>
  </body>
</html>
