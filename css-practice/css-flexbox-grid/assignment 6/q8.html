<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q8.css" />
  </head>

  <body>
    <h1>My Photo Gallery</h1>

    <main class="gallery">
      <figure class="photo">
        <img src="https://picsum.photos/id/1015/600/400" alt="Mountain" />
        <figcaption>Beautiful Mountain</figcaption>
      </figure>

      <figure class="photo">
        <img src="https://picsum.photos/id/1016/600/400" alt="Nature" />
        <figcaption>Peaceful Nature</figcaption>
      </figure>

      <figure class="photo">
        <img src="https://picsum.photos/id/1025/600/400" alt="Animal" />
        <figcaption>Lovely Animal</figcaption>
      </figure>

      <figure class="photo">
        <img src="https://picsum.photos/id/1035/600/400" alt="Forest" />
        <figcaption>Green Forest</figcaption>
      </figure>

      <figure class="photo">
        <img src="https://picsum.photos/id/1043/600/400" alt="Beach" />
        <figcaption>Beautiful Beach</figcaption>
      </figure>

      <figure class="photo">
        <img src="https://picsum.photos/id/1050/600/400" alt="Landscape" />
        <figcaption>Natural Landscape</figcaption>
      </figure>
    </main>
  </body>
</html>
