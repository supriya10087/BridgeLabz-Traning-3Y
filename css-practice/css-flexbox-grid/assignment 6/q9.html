<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Flip</title>
    <link rel="stylesheet" href="q9.css" />
  </head>

  <body>
    <div class="card-container">
      <div class="card">
        <!-- Front Side -->
        <div class="card-front">
          <img src="https://picsum.photos/300/200" alt="Nature Image" />
          <h2>Nature</h2>
        </div>

        <!-- Back Side -->
        <div class="card-back">
          <h2>About Nature</h2>
          <p>
            Nature provides beautiful landscapes and a peaceful environment for
            all living beings.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
