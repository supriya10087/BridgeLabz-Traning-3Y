<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter_comparison_layout.css">
</head>
<body>
    <main>
        <h1>Before & After Filter</h1>
        <section class="comparison">
            <figure><img src="https://picsum.photos/id/1018/700/450" alt="Original landscape"><figcaption>Before — Original</figcaption></figure>
            <figure><img class="filtered" src="https://picsum.photos/id/1018/700/450" alt="Filtered landscape"><figcaption>After — Contrast Filter</figcaption></figure>
        </section>
    </main>
</body>
</html>
