<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanderly Travel Agency</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <!-- Bootstrap Carousel needs Bootstrap's bundle JavaScript for controls and automatic sliding. -->
  <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#travelCarousel" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="3000"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80" class="d-block w-100" alt="Tropical beach"><div class="carousel-caption"><h1>Maldives</h1><p>Relax beside crystal-clear water.</p></div></div>
      <div class="carousel-item" data-bs-interval="3000"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=80" class="d-block w-100" alt="Mountain landscape"><div class="carousel-caption"><h1>Swiss Alps</h1><p>Discover peaceful mountain escapes.</p></div></div>
      <div class="carousel-item" data-bs-interval="3000"><img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1600&q=80" class="d-block w-100" alt="Paris"><div class="carousel-caption"><h1>Paris</h1><p>Experience art, food and timeless streets.</p></div></div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
    <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
  </div>
</header>
<main class="container py-5">
  <section class="text-center"><h2>Booking Progress</h2><p class="text-secondary">Your current trip planning progress</p>
    <!-- progress-bar-striped and progress-bar-animated satisfy the assignment requirement. -->
    <div class="progress" role="progressbar" aria-label="Booking completion" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div></div>
  </section>
</main>
<footer class="bg-dark text-white text-center py-4"><h2 class="h5">Wanderly Travel Agency</h2><p class="mb-0">travel@wanderly.example · +91 98765 43210</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
