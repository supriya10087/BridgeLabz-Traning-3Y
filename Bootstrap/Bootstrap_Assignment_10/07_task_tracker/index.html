<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="bg-light">
<header class="bg-dark text-white py-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="h3 mb-0">Task Tracker</h1><span class="badge text-bg-warning fs-6">Pending: 4</span></div></header>
<main class="container py-5">
  <div class="list-group shadow-sm">
    <!-- list-group provides the vertical task list; badges show task priority. -->
    <div class="list-group-item d-flex justify-content-between align-items-center"><div><strong>Complete Bootstrap assignment</strong><br><small class="text-secondary">Due today</small></div><span class="badge text-bg-danger rounded-pill">High</span></div>
    <div class="list-group-item d-flex justify-content-between align-items-center"><div><strong>Prepare presentation slides</strong><br><small class="text-secondary">Due tomorrow</small></div><span class="badge text-bg-warning rounded-pill">Medium</span></div>
    <div class="list-group-item d-flex justify-content-between align-items-center"><div><strong>Update portfolio</strong><br><small class="text-secondary">This week</small></div><span class="badge text-bg-success rounded-pill">Low</span></div>
    <div class="list-group-item d-flex justify-content-between align-items-center"><div><strong>Review project notes</strong><br><small class="text-secondary">This week</small></div><span class="badge text-bg-warning rounded-pill">Medium</span></div>
  </div>
  <button class="btn btn-primary mt-4">Completed <span class="badge text-bg-light text-dark">2</span></button>
</main>
</body></html>
