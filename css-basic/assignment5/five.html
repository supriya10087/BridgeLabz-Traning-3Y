<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="five.css">
</head>
<body>

    <h1>Choose Your Plan</h1>

    <main class="pricing">

        <section class="plan">
            <h2>Basic</h2>
            <p class="price">$9/month</p>
            <ul>
                <li>5 Projects</li>
                <li>5 GB Storage</li>
                <li>Email Support</li>
            </ul>
            <a href="#">Choose Plan</a>
        </section>

        <section class="plan popular">
            <h2>Standard</h2>
            <p class="price">$19/month</p>
            <ul>
                <li>20 Projects</li>
                <li>20 GB Storage</li>
                <li>Priority Support</li>
            </ul>
            <a href="#">Choose Plan</a>
        </section>

        <section class="plan">
            <h2>Premium</h2>
            <p class="price">$39/month</p>
            <ul>
                <li>Unlimited Projects</li>
                <li>100 GB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <a href="#">Choose Plan</a>
        </section>

    </main>

</body>
</html>
